<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tôn Giả Mục Kiền Liên - Trang Tổng Hợp</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Hiệu ứng sao lấp lánh background */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: transparent;
            z-index: 0;
            box-shadow: 174px 212px #fff, 832px 412px #fff, 342px 712px #fff, 122px 912px #fff, 512px 112px #fff, 912px 612px #fff, 222px 312px #fff;
            animation: animateStars 50s linear infinite;
        }

        @keyframes animateStars {
            from {
                transform: translateY(0px);
            }
            to {
                transform: translateY(-2000px);
            }
        }

        /* Header trang */
        header {
            position: relative;
            z-index: 10;
            background: rgba(15, 20, 35, 0.9);
            padding: 15px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
        }

        header h1 {
            margin: 0;
            font-size: 20px;
            color: #ffcc00;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.4);
        }

        /* Bố cục chính */
        .main-layout {
            position: relative;
            z-index: 10;
            display: flex;
            flex: 1;
            height: calc(100vh - 55px);
        }

        /* Sidebar menu bên trái */
        nav {
            width: 300px;
            background: rgba(15, 20, 35, 0.8);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            backdrop-filter: blur(8px);
            overflow-y: auto;
        }

        nav a {
            display: block;
            padding: 12px 16px;
            color: #e0e0e0;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        nav a:hover, nav a.active {
            background: rgba(255, 204, 0, 0.2);
            color: #ffcc00;
            border-color: rgba(255, 204, 0, 0.5);
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.2);
        }

        /* Khung hiển thị nội dung trang (Iframe) */
        .content-viewer {
            flex: 1;
            background: transparent;
            border: none;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
        }

        @media (max-width: 768px) {
            .main-layout {
                flex-direction: column;
            }

            nav {
                width: 100%;
                max-height: 200px;
            }
        }
    </style>
</head>
<body>

    <div class="stars"></div>

    <header>
        <h1>TÔN GIẢ MỤC KIỀN LIÊN – ĐỆ NHẤT THẦN THÔNG</h1>
    </header>

    <div class="main-layout">
        <nav>
            <a href="index1.html" target="contentFrame" class="active" onclick="setActive(this)">I. Thời Thơ Ấu</a>
            <a href="index2.html" target="contentFrame" onclick="setActive(this)">II. Hành Trình Tìm Chân Lý</a>
            <a href="index3.html" target="contentFrame" onclick="setActive(this)">III. Thượng Thủ Tăng Đoàn</a>
            <a href="index4.html" target="contentFrame" onclick="setActive(this)">IV. Thần Thông Đệ Nhất</a>
            <a href="index5.html" target="contentFrame" onclick="setActive(this)">V. Vị Thánh Đệ Tử Ưu Tú</a>
            <a href="index6.html" target="contentFrame" onclick="setActive(this)">VII. Thơ Tụng Tôn Giả</a>
        </nav>

        <div class="content-viewer">
            <iframe name="contentFrame" src="index1.html"></iframe>
        </div>
    </div>

    <script>
        function setActive(element) {
            const links = document.querySelectorAll('nav a');
            links.forEach(link => link.classList.remove('active'));
            element.classList.add('active');
        }
    </script>

</body>
</html>
